<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OurEarth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="target">
    <div class="content-card">
        <main>
    
            <section class="section-product">
              <h2 class="section-title">Search by Product</h2>
              <div class="search-bar-wrapper">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" class="search-input" placeholder="Yeti 32 oz Rambler (Black)" />
              </div>
            </section>
            <span class="divider-text">or</span>

    <section class="section-image">
      <h2 class="section-title">Search by Image</h2>
      
      <div class="upload-container">
        <div class="image-preview-box">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </div>
        <div class="upload-controls">
          <p class="instruction-text">Please upload an image</p>
          <div class="file-input-group">
            <button class="button">Upload</button>
            <span class="file-status">No File Chosen</span>
          </div>
        </div>
      </div>

      <button id="button-done" class="button button-done" onclick="showDone()">Done</button>
    </section>

  </main>
      </div>
      <script src="script.js"></script>
</body>
</html>
